server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: trip-updates-gateway
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        # Ready only when the event store is reachable; liveness stays independent of Redis.
        readiness:
          include: readinessState,redis
          show-components: always
  metrics:
    tags:
      node: ${app.node-id}

logging:
  structured:
    format:
      console: ecs

app:
  node-id: ${APP_NODE_ID:local}
  redis:
    uri: ${APP_REDIS_URI:redis://localhost:6379}
    command-timeout: 2s
  outbox:
    critical-capacity: 512
    location-capacity: 2048
    pending-capacity: 1000
    max-subscriptions-per-connection: 50
    send-timeout: 10s
  retention:
    log-max-length: 1000
    bus-max-length: 100000
    topic-key-ttl: 24h
    dedup-ttl: 5m
  notifications:
    channel: notify:events
    reconcile-interval: 5s
  auth:
    # NONE rejects every WebSocket connection (fail closed). DEV accepts the well-known tokens of
    # dev/dev-fixtures.json and must only be used for local runs and tests.
    mode: ${APP_AUTH_MODE:NONE}
    revalidate-interval: 30s
    # DEV mode only: generated load-test fleet (sim.SyntheticFleet); all zero = disabled.
    synthetic-fleet:
      tenants: 0
      offices-per-tenant: 0
      cabs-per-office: 0
      passengers-per-trip: 0
  websocket:
    max-message-chars: 4096
    allowed-origin-patterns: []
    heartbeat-interval: 20s
    idle-timeout: 60s
