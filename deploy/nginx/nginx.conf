worker_processes auto;

events {
    worker_connections 16384;
}

http {
    # Never log query strings: browsers pass the JWT as ?access_token=.
    log_format noargs '$remote_addr [$time_local] "$request_method $uri" $status $request_time $upstream_addr';
    access_log /dev/stdout noargs;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream gateways {
        least_conn;
        server gateway-1:8080 max_fails=1 fail_timeout=5s;
        server gateway-2:8080 max_fails=1 fail_timeout=5s;
        server gateway-3:8080 max_fails=1 fail_timeout=5s;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://gateways;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_next_upstream error timeout;
        }
    }
}
