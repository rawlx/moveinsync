# One-command local stack: docker compose up --build
# redis (single node, AOF everysec, noeviction) + 3 identical gateways + nginx load balancer on :8080.

x-gateway: &gateway
  build: .
  image: trip-updates-gateway:local
  environment: &gateway-env
    APP_REDIS_URI: redis://redis:6379
  depends_on:
    redis:
      condition: service_healthy
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/liveness | grep -q UP"]
    interval: 5s
    timeout: 3s
    retries: 20
    start_period: 20s
  restart: "no"

services:
  redis:
    image: redis:7.4.12-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - redis-data:/data

  gateway-1:
    <<: *gateway
    environment:
      <<: *gateway-env
      APP_NODE_ID: gateway-1

  gateway-2:
    <<: *gateway
    environment:
      <<: *gateway-env
      APP_NODE_ID: gateway-2

  gateway-3:
    <<: *gateway
    environment:
      <<: *gateway-env
      APP_NODE_ID: gateway-3

  nginx:
    image: nginx:1.28.3-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      gateway-1:
        condition: service_healthy
      gateway-2:
        condition: service_healthy
      gateway-3:
        condition: service_healthy

volumes:
  redis-data:
